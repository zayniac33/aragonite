name: Build Preview

on:
  push:
    branches: ['main']
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew -PIS_NEXT=true assembleDebug

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/aragonite-next.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aragonite-apk
          path: app/build/outputs/apk/debug/aragonite-next.apk
